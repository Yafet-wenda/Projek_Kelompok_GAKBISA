<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Daftar Akun')}"></head>
<body style="background:#F0F2F5;padding-top:0;min-height:100vh;display:flex;flex-direction:column;">

    <!-- Simple nav -->
    <div style="background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.08);">
        <a th:href="@{/}" style="font-size:28px;font-weight:900;color:#1877F2;letter-spacing:-1px;text-decoration:none;">GAKBISA</a>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">

        <!-- Brand tagline -->
        <div class="text-center mb-4">
            <p style="font-size:20px;color:#050505;margin:0;">
                Buat akun baru · <span style="color:#65676B;">Gratis dan akan selalu gratis.</span>
            </p>
        </div>

        <div style="background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 16px rgba(0,0,0,0.12);width:432px;max-width:100%;">
            <form th:action="@{/register}" method="post" th:object="${registrationDto}">
                <div class="mb-3">
                    <input type="text" th:field="*{fullName}" class="form-control form-control-lg"
                           placeholder="Nama Lengkap" required autofocus>
                    <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small mt-1"
                         th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <input type="email" th:field="*{email}" class="form-control form-control-lg"
                           placeholder="Email" required>
                    <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1"
                         th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <input type="password" th:field="*{password}" class="form-control form-control-lg"
                           placeholder="Password (min. 8 karakter)" required>
                    <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1"
                         th:errors="*{password}"></div>
                </div>
                <div class="mb-4">
                    <input type="password" th:field="*{confirmPassword}" class="form-control form-control-lg"
                           placeholder="Konfirmasi Password" required>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <p style="font-size:12px;color:#65676B;margin-bottom:16px;text-align:center;">
                    Dengan mendaftar, kamu setuju dengan Ketentuan dan Kebijakan Privasi GAKBISA.
                </p>

                <button type="submit" class="btn btn-success w-100 fw-bold" style="font-size:17px;padding:12px;">
                    Daftar
                </button>
            </form>

            <hr style="margin:16px 0;border-color:#CED0D4;">

            <div class="text-center">
                <a th:href="@{/login}" class="btn btn-outline-primary fw-bold" style="font-size:15px;">
                    Sudah punya akun? Masuk
                </a>
            </div>
        </div>

        <p class="mt-4" style="font-size:12px;color:#65676B;text-align:center;">
            &copy; 2026 GAKBISA &middot; Politeknik Elektronika Negeri Surabaya
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
