spring:
  application:
    name: gakbisa-backend

  config:
    # Nama berkas env diambil dari GAKBISA_ENV (diatur oleh start.ps1). Default ".env" = PostgreSQL lokal.
    import: optional:file:${GAKBISA_ENV:.env}[.properties]

  datasource:
    # Nilainya diambil dari .env (lihat .env.example). DB_SSL_MODE: require untuk Supabase, disable untuk lokal.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gakbisa}?sslmode=${DB_SSL_MODE:disable}&preparedStatementCacheQueries=0&prepareThreshold=0
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

server:
  port: 8080

gakbisa:
  security:
    # Kunci tanda tangan JWT (HS256), minimal 32 karakter. Kosong = dibuat acak tiap start
    # (token lama tidak berlaku lagi setelah restart) — hanya untuk development.
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
    # Origin frontend yang boleh memanggil API ini (pisahkan dengan koma).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
  storage:
    base-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${STORAGE_BUCKET:portfolio-files}
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10485760}
    allowed-mime-types: ${ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,application/pdf}

logging:
  # Console dibuat ringkas: jam, tingkat, logger pendek. Timestamp lengkap dan PID panjang
  # hanya berguna di berkas log server, bukan di terminal.
  pattern:
    console: "%d{HH:mm:ss} %-5level %-34.34logger{34} : %msg%n"
  level:
    root: info
    com.gakbisa: info
    # Framework bicara banyak saat start normal; peringatannya tetap tampil kalau bermasalah.
    org.springframework: warn
    org.apache.catalina: warn
    org.hibernate: warn
    com.zaxxer.hikari: warn
