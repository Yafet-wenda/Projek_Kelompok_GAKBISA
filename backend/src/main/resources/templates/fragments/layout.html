<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="id">
<!--
  Fragment bersama: <head>, bilah atas, dan kaki halaman.
  Pemakaian: th:replace="~{fragments/layout :: head('Judul halaman')}"
-->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">GAKBISA</title>
  <script>
    (function () {
      var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        var saved = localStorage.getItem('gk-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <meta name="description" content="GAKBISA: Gantian Ajari, Kita Bisa! Pertukaran keahlian antarpengguna: tawarkan keahlianmu, pelajari keahlian temanmu.">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <link rel="icon" type="image/png" th:href="@{/images/gakbisa-logo-64.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/gakbisa.css}">
  <!-- GAKBISA Design System: tokens, components, utilities -->
  <link rel="stylesheet" th:href="@{/css/design-system.css}">
  <!-- GAKBISA Navbar, Sidebar & Layout -->
  <link rel="stylesheet" th:href="@{/css/gk-navbar.css}">
  <link rel="stylesheet" th:href="@{/css/gk-sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/gk-layout.css}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script th:src="@{/js/gk-navbar.js}" defer></script>
  <script th:src="@{/js/gk-sidebar.js}" defer></script>
</head>
<body>

<a th:fragment="skip" class="skip" href="#isi">Lewati ke isi halaman</a>

<header th:fragment="topbar(active)" class="topbar">
  <div class="shell topbar__in">
    <a class="mark" th:href="@{/}">
      <img th:src="@{/images/gakbisa-logo.png}" alt="" width="34" height="34">
      <span>
        <span class="mark__name">GAKBISA</span>
        <span class="mark__sub">Gantian Ajari</span>
      </span>
    </a>

    <nav class="nav" aria-label="Navigasi utama">
      <a th:href="@{/}"
         th:classappend="${active == 'beranda'} ? 'is-active'">Beranda</a>
      <a th:href="@{/catalog}"
         th:classappend="${active == 'katalog'} ? 'is-active'">Katalog</a>
      <a th:href="@{/dashboard}" sec:authorize="isAuthenticated()"
         th:classappend="${active == 'dasbor'} ? 'is-active'">Dasbor</a>
      <a th:href="@{/login}" sec:authorize="!isAuthenticated()"
         th:classappend="${active == 'masuk'} ? 'is-active'">Masuk</a>
      <a th:href="@{/register}" sec:authorize="!isAuthenticated()"
         th:classappend="${active == 'daftar'} ? 'is-active'"
         class="btn btn--leaf btn--sm">Daftar</a>

      <span sec:authorize="isAuthenticated()" class="userchip">
        <span class="avatar"
              th:text="${#strings.toUpperCase(#strings.substring(#authentication.principal.user.fullName, 0, 1))}">G</span>
        <span class="who" th:text="${#authentication.principal.user.fullName}">Nama Pengguna</span>
        <form class="inline" th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn--ghost btn--sm" type="submit">Keluar</button>
        </form>
      </span>
    </nav>
  </div>
</header>

<footer th:fragment="foot" class="foot">
  <div class="shell foot__in">
    <p>&copy; 2026 GAKBISA. Gantian Ajari, Kita Bisa!</p>
    <a th:href="@{/catalog}">Katalog keahlian</a>
  </div>
</footer>

</body>
</html>
