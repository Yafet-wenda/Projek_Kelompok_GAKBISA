<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Notifikasi')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="fb-layout container-fluid">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="fb-main">

        <div class="fb-card">
            <div class="fb-card-header" style="padding:16px;">
                <h4 style="font-size:24px;font-weight:700;margin:0;">Notifikasi</h4>
                <form th:action="@{/notifications/read-all}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-fb-secondary btn-sm fw-semibold">
                        <i class="bi bi-check2-all me-1"></i>Tandai Semua Dibaca
                    </button>
                </form>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(notifications)}" class="fb-empty">
                <i class="bi bi-bell-slash"></i>
                <h5>Tidak Ada Notifikasi</h5>
                <p>Anda akan mendapat notifikasi saat ada barter, sesi, atau ulasan baru.</p>
            </div>

            <!-- Notification list -->
            <div th:if="${!#lists.isEmpty(notifications)}" class="p-2">
                <div th:each="notif : ${notifications}">
                    <div th:classappend="${!notif.isRead} ? 'unread'" class="fb-notif-item">
                        <!-- Icon based on type -->
                        <div class="notif-icon"
                             th:style="${notif.type == 'barter'} ? 'background:#1877F2' : (${notif.type == 'session'} ? 'background:#42b72a' : (${notif.type == 'review'} ? 'background:#f7981c' : 'background:#65676B'))">
                            <i th:classappend="${notif.type == 'barter'} ? 'bi bi-arrow-left-right' : (${notif.type == 'session'} ? 'bi bi-calendar-event-fill' : (${notif.type == 'review'} ? 'bi bi-star-fill' : 'bi bi-bell-fill'))"></i>
                        </div>
                        <div class="notif-content flex-grow-1">
                            <div class="notif-title" th:text="${notif.title}">Judul</div>
                            <div class="notif-body" th:text="${notif.body}">Isi notifikasi</div>
                            <div class="notif-time"
                                 th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}">Waktu</div>
                        </div>
                        <div class="d-flex flex-column align-items-end gap-2">
                            <div th:if="${!notif.isRead}" class="unread-dot"></div>
                            <form th:if="${!notif.isRead}"
                                  th:action="@{'/notifications/' + ${notif.id} + '/read'}"
                                  method="post" style="margin:0;">
                                <button type="submit" class="btn btn-link btn-sm p-0"
                                        style="font-size:12px;color:#65676B;" title="Tandai dibaca">
                                    <i class="bi bi-check2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <aside class="fb-sidebar-right">
        <div class="fb-card p-3">
            <div style="font-size:16px;font-weight:700;margin-bottom:8px;">🔔 Jenis Notifikasi</div>
            <div style="font-size:13px;color:#65676B;line-height:2;">
                <div><i class="bi bi-arrow-left-right text-primary me-1"></i> Permintaan barter</div>
                <div><i class="bi bi-calendar-event text-success me-1"></i> Sesi belajar</div>
                <div><i class="bi bi-star-fill text-warning me-1"></i> Ulasan baru</div>
                <div><i class="bi bi-shield-fill text-secondary me-1"></i> Moderasi</div>
            </div>
        </div>
    </aside>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
