<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="fb-layout container-fluid">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="fb-main" style="max-width:900px;">

        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-shield-fill-check text-warning" style="font-size:28px;"></i>
            <h4 style="font-size:24px;font-weight:700;margin:0;">Admin Dashboard</h4>
        </div>

        <!-- Stat cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4">
                <div class="admin-stat-card">
                    <div class="stat-icon-circle" style="background:#e7f3ff;color:#1877F2;">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <div class="stat-num" th:text="${totalUsers}">0</div>
                    <div class="stat-label">Total Pengguna</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="admin-stat-card">
                    <div class="stat-icon-circle" style="background:#e8f5e9;color:#2e7d32;">
                        <i class="bi bi-collection-fill"></i>
                    </div>
                    <div class="stat-num" th:text="${totalPortfolios}">0</div>
                    <div class="stat-label">Total Portofolio</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="admin-stat-card">
                    <div class="stat-icon-circle" style="background:#fff3e0;color:#f57c00;">
                        <i class="bi bi-arrow-left-right"></i>
                    </div>
                    <div class="stat-num" th:text="${totalBarters}">0</div>
                    <div class="stat-label">Total Barter</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="admin-stat-card">
                    <div class="stat-icon-circle" style="background:#e0f2f1;color:#00796b;">
                        <i class="bi bi-calendar-check-fill"></i>
                    </div>
                    <div class="stat-num" th:text="${totalSessions}">0</div>
                    <div class="stat-label">Total Sesi</div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="admin-stat-card">
                    <div class="stat-icon-circle" style="background:#ffebee;color:#c62828;">
                        <i class="bi bi-flag-fill"></i>
                    </div>
                    <div class="stat-num" th:text="${openReports}">0</div>
                    <div class="stat-label">Laporan Terbuka</div>
                </div>
            </div>
        </div>

        <!-- Quick actions -->
        <div class="fb-card p-4">
            <h5 style="font-size:18px;font-weight:700;margin-bottom:16px;">Aksi Cepat</h5>
            <div class="row g-3">
                <div class="col-6 col-md-3">
                    <a th:href="@{/admin/users}" class="d-flex flex-column align-items-center p-3 rounded text-decoration-none"
                       style="background:#F0F2F5;transition:background .2s;" onmouseover="this.style.background='#e4e6e9'" onmouseout="this.style.background='#F0F2F5'">
                        <i class="bi bi-people-fill" style="font-size:28px;color:#1877F2;margin-bottom:8px;"></i>
                        <span style="font-weight:600;font-size:14px;color:#050505;">Pengguna</span>
                    </a>
                </div>
                <div class="col-6 col-md-3">
                    <a th:href="@{/admin/categories}" class="d-flex flex-column align-items-center p-3 rounded text-decoration-none"
                       style="background:#F0F2F5;transition:background .2s;" onmouseover="this.style.background='#e4e6e9'" onmouseout="this.style.background='#F0F2F5'">
                        <i class="bi bi-tags-fill" style="font-size:28px;color:#42b72a;margin-bottom:8px;"></i>
                        <span style="font-weight:600;font-size:14px;color:#050505;">Kategori</span>
                    </a>
                </div>
                <div class="col-6 col-md-3">
                    <a th:href="@{/admin/portfolios}" class="d-flex flex-column align-items-center p-3 rounded text-decoration-none"
                       style="background:#F0F2F5;transition:background .2s;" onmouseover="this.style.background='#e4e6e9'" onmouseout="this.style.background='#F0F2F5'">
                        <i class="bi bi-collection-fill" style="font-size:28px;color:#f7981c;margin-bottom:8px;"></i>
                        <span style="font-weight:600;font-size:14px;color:#050505;">Portofolio</span>
                    </a>
                </div>
                <div class="col-6 col-md-3">
                    <a th:href="@{/admin/reports}" class="d-flex flex-column align-items-center p-3 rounded text-decoration-none"
                       style="background:#F0F2F5;transition:background .2s;" onmouseover="this.style.background='#e4e6e9'" onmouseout="this.style.background='#F0F2F5'">
                        <i class="bi bi-flag-fill" style="font-size:28px;color:#c62828;margin-bottom:8px;"></i>
                        <span style="font-weight:600;font-size:14px;color:#050505;">Laporan</span>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <aside class="fb-sidebar-right">
        <div class="fb-card p-3">
            <div style="font-size:16px;font-weight:700;margin-bottom:8px;">⚙️ Panel Admin</div>
            <p style="font-size:13px;color:#65676B;">
                Anda memiliki akses penuh untuk mengelola pengguna, kategori, portofolio, dan laporan.
            </p>
        </div>
    </aside>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
