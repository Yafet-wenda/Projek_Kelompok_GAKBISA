<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GAKBISA: pertukaran keahlian antarmahasiswa. Tawarkan keahlianmu, pelajari keahlian temanmu, tanpa biaya kursus.">
    <!-- Token untuk request fetch() dari js/app.js; tanpa ini aksi dari halaman dinamis gagal. -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/gakbisa-mark.svg}">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gk-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
    <title th:text="${title} + ' | GAKBISA'">GAKBISA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <!-- GAKBISA Design System: tokens, components, utilities -->
    <link th:href="@{/css/design-system.css}" rel="stylesheet">
    <!-- GAKBISA Navbar, Sidebar & 3-Column Layout -->
    <link th:href="@{/css/gk-navbar.css}" rel="stylesheet">
    <link th:href="@{/css/gk-sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/gk-layout.css}" rel="stylesheet">
    <!-- Bootstrap JS (untuk dropdown/tooltip) + Navbar & Sidebar JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/gk-navbar.js}" defer></script>
    <script th:src="@{/js/gk-sidebar.js}" defer></script>
</head>
</html>
