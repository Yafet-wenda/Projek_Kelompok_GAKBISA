<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="fb-navbar">
    <!-- Left: Brand + Search -->
    <div class="d-flex align-items-center" style="min-width:220px;">
        <a th:href="@{/}" class="navbar-brand me-1" style="font-size:28px;font-weight:900;color:#1877F2;letter-spacing:-1px;">
            GAKBISA
        </a>
        <div class="search-wrapper d-none d-md-flex">
            <i class="bi bi-search"></i>
            <form th:action="@{/matching}" method="get" style="margin:0;">
                <input type="text" name="keyword" placeholder="Cari partner keahlian..." style="background:transparent;border:none;outline:none;font-size:14px;width:180px;">
            </form>
        </div>
    </div>

    <!-- Center: Nav tabs (authenticated only) -->
    <div class="nav-center" sec:authorize="isAuthenticated()">
        <a th:href="@{/dashboard}" class="nav-tab" title="Dashboard">
            <i class="bi bi-house-fill"></i>
        </a>
        <a th:href="@{/matching}" class="nav-tab" title="Cari Partner">
            <i class="bi bi-people-fill"></i>
        </a>
        <a th:href="@{/barter}" class="nav-tab" title="Barter">
            <i class="bi bi-arrow-left-right"></i>
        </a>
        <a th:href="@{/sessions}" class="nav-tab" title="Sesi Belajar">
            <i class="bi bi-calendar-event-fill"></i>
        </a>
        <a th:href="@{/portfolio}" class="nav-tab" title="Portofolio">
            <i class="bi bi-collection-fill"></i>
        </a>
    </div>

    <!-- Right: Action buttons -->
    <div class="nav-right">
        <!-- Authenticated -->
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
            <!-- Notifications -->
            <div class="dropdown">
                <a href="#" class="fb-icon-btn" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notifikasi">
                    <i class="bi bi-bell-fill"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end fb-dropdown-menu" style="width:360px;padding:8px;" aria-labelledby="notifDropdown">
                    <li class="px-3 py-2" style="font-size:20px;font-weight:700;">Notifikasi</li>
                    <li><hr class="fb-dropdown-divider"></li>
                    <li>
                        <a th:href="@{/notifications}" class="fb-dropdown-item">
                            <span class="item-icon" style="background:#e7f3ff;color:#1877F2;"><i class="bi bi-bell"></i></span>
                            <div>
                                <div style="font-weight:600;">Lihat Semua Notifikasi</div>
                                <div style="font-size:12px;color:#65676B;">Buka halaman notifikasi</div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Profile dropdown -->
            <div class="dropdown">
                <a href="#" class="fb-icon-btn" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Akun">
                    <i class="bi bi-person-circle" style="font-size:22px;"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end fb-dropdown-menu" aria-labelledby="profileDropdown">
                    <li>
                        <a th:href="@{/profile}" class="fb-dropdown-item">
                            <span class="item-icon"><i class="bi bi-person-fill"></i></span>
                            <div>
                                <div style="font-weight:700;" sec:authentication="name">Pengguna</div>
                                <div style="font-size:12px;color:#65676B;">Lihat profil Anda</div>
                            </div>
                        </a>
                    </li>
                    <li><hr class="fb-dropdown-divider"></li>
                    <li>
                        <a th:href="@{/profile/skills}" class="fb-dropdown-item">
                            <span class="item-icon" style="background:#e7f3ff;color:#1877F2;"><i class="bi bi-stars"></i></span>
                            Kelola Keahlian
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/portfolio}" class="fb-dropdown-item">
                            <span class="item-icon" style="background:#e7f3ff;color:#1877F2;"><i class="bi bi-collection"></i></span>
                            Portofolio Saya
                        </a>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin}" class="fb-dropdown-item">
                            <span class="item-icon" style="background:#fff3e0;color:#f57c00;"><i class="bi bi-gear-fill"></i></span>
                            Panel Admin
                        </a>
                    </li>
                    <li><hr class="fb-dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button type="submit" class="fb-dropdown-item w-100 border-0" style="background:transparent;cursor:pointer;">
                                <span class="item-icon" style="background:#ffebee;color:#c62828;"><i class="bi bi-box-arrow-right"></i></span>
                                Keluar
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Not authenticated -->
        <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
            <a th:href="@{/login}" class="btn btn-fb-secondary btn-sm">Login</a>
            <a th:href="@{/register}" class="btn btn-fb-primary btn-sm">Daftar</a>
        </div>
    </div>
</nav>
</body>
</html>
