<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Sistem ikon garis tunggal. Pemakaian:
  <th:block th:replace="~{fragments/icons :: icon('bell')}"></th:block>
  Warna mengikuti currentColor; ukuran diatur oleh kelas induk.
-->
<svg th:fragment="icon(name)" class="ico" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false" th:switch="${name}">

  <g th:case="'brand'">
    <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0z"/>
    <path d="M7 9h8"/><path d="m12 6 3 3-3 3"/>
    <path d="M17 15H9"/><path d="m12 12-3 3 3 3"/>
  </g>

  <g th:case="'home'">
    <path d="M4 11.2 12 4l8 7.2"/>
    <path d="M6.5 9.6V20h11V9.6"/>
    <path d="M10 20v-5.5h4V20"/>
  </g>

  <g th:case="'user'">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M5 20c1.4-3.4 3.8-5 7-5s5.6 1.6 7 5"/>
  </g>

  <g th:case="'users'">
    <circle cx="9" cy="8.5" r="3.2"/>
    <path d="M3 19.5c1.2-3 3.2-4.4 6-4.4s4.8 1.4 6 4.4"/>
    <path d="M15.5 6.1a3.1 3.1 0 0 1 0 5.8"/>
    <path d="M17.5 19.5c-.2-1.7-.7-3-1.5-4"/>
  </g>

  <g th:case="'award'">
    <circle cx="12" cy="9" r="4.8"/>
    <path d="M9.2 13.2 8 21l4-2 4 2-1.2-7.8"/>
  </g>

  <g th:case="'grid'">
    <rect x="4" y="4" width="7" height="7" rx="1"/>
    <rect x="13" y="4" width="7" height="7" rx="1"/>
    <rect x="4" y="13" width="7" height="7" rx="1"/>
    <rect x="13" y="13" width="7" height="7" rx="1"/>
  </g>

  <g th:case="'swap'">
    <path d="M4 8h13"/><path d="m14 5 3 3-3 3"/>
    <path d="M20 16H7"/><path d="m10 13-3 3 3 3"/>
  </g>

  <g th:case="'calendar'">
    <rect x="4" y="5.5" width="16" height="14.5" rx="1.5"/>
    <path d="M4 10h16"/><path d="M8 3.5v4"/><path d="M16 3.5v4"/>
  </g>

  <g th:case="'folder'">
    <path d="M3.5 7.5h6l1.8 2h9.2V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/>
  </g>

  <g th:case="'layers'">
    <path d="m12 3.5 8.5 4.5L12 12.5 3.5 8z"/>
    <path d="m3.5 12.3 8.5 4.5 8.5-4.5"/>
    <path d="m3.5 16 8.5 4.5 8.5-4.5"/>
  </g>

  <g th:case="'bell'">
    <path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2H5z"/>
    <path d="M10 19.5a2 2 0 0 0 4 0"/>
  </g>

  <g th:case="'shield'">
    <path d="M12 3.5 19 6v5.7c0 4.2-2.9 6.9-7 8.8-4.1-1.9-7-4.6-7-8.8V6z"/>
    <path d="m9 12 2.2 2.2 4.3-4.4"/>
  </g>

  <g th:case="'flag'">
    <path d="M6 21V4"/>
    <path d="M6 5c3.5-1.8 6 1.6 9.5 0v7.5c-3.5 1.6-6-1.8-9.5 0"/>
  </g>

  <g th:case="'search'">
    <circle cx="11" cy="11" r="6.3"/>
    <path d="m15.8 15.8 4.4 4.4"/>
  </g>

  <g th:case="'menu'">
    <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
  </g>

  <g th:case="'x'">
    <path d="m6 6 12 12"/><path d="M18 6 6 18"/>
  </g>

  <g th:case="'check'">
    <path d="m5 12.5 4.2 4.2L19 7"/>
  </g>

  <g th:case="'plus'">
    <path d="M12 5v14"/><path d="M5 12h14"/>
  </g>

  <g th:case="'edit'">
    <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/>
    <path d="m13.5 6.5 3 3"/>
  </g>

  <g th:case="'trash'">
    <path d="M4 7h16"/>
    <path d="M9.5 7V4.5h5V7"/>
    <path d="m6.5 7 .9 13h9.2l.9-13"/>
  </g>

  <g th:case="'upload'">
    <path d="M12 16V5"/>
    <path d="m7.5 9.5 4.5-4.5 4.5 4.5"/>
    <path d="M5 19h14"/>
  </g>

  <g th:case="'download'">
    <path d="M12 4v11"/>
    <path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
    <path d="M5 20h14"/>
  </g>

  <g th:case="'file'">
    <path d="M6 3.5h7l5 5V20.5H6z"/>
    <path d="M13 3.5v5h5"/>
  </g>

  <g th:case="'clock'">
    <circle cx="12" cy="12" r="8.4"/>
    <path d="M12 7.5V12l3 1.9"/>
  </g>

  <g th:case="'video'">
    <rect x="3" y="6.5" width="12" height="11" rx="1.6"/>
    <path d="m15 10.5 6-3.5v10l-6-3.5"/>
  </g>

  <g th:case="'star'">
    <path d="m12 4 2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.7-4.9 2.7.9-5.5-4-3.9 5.6-.8z"/>
  </g>

  <g th:case="'arrow-left'">
    <path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>
  </g>

  <g th:case="'arrow-right'">
    <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
  </g>

  <g th:case="'arrow-up-right'">
    <path d="M7 17 17 7"/><path d="M9.5 7H17v7.5"/>
  </g>

  <g th:case="'logout'">
    <path d="M14 5h4.5v14H14"/>
    <path d="M4 12h10"/>
    <path d="m10.5 8.5 3.5 3.5-3.5 3.5"/>
  </g>

  <g th:case="'mail'">
    <rect x="3" y="5.5" width="18" height="13" rx="1.6"/>
    <path d="m3.8 6.5 8.2 6.6 8.2-6.6"/>
  </g>

  <g th:case="'pin'">
    <path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/>
    <circle cx="12" cy="11" r="2.2"/>
  </g>

  <g th:case="'pause'">
    <path d="M9 5v14"/><path d="M15 5v14"/>
  </g>

  <g th:case="'play'">
    <path d="M8 5.5v13l10-6.5z"/>
  </g>

  <g th:case="'eye'">
    <path d="M2.8 12S6.2 5.8 12 5.8 21.2 12 21.2 12 17.8 18.2 12 18.2 2.8 12 2.8 12z"/>
    <circle cx="12" cy="12" r="3"/>
  </g>

  <g th:case="'info'">
    <circle cx="12" cy="12" r="8.4"/>
    <path d="M12 11v5.8"/><path d="M12 7.7v.3"/>
  </g>

  <g th:case="'alert'">
    <path d="M12 4 21 19.5H3z"/>
    <path d="M12 10v4.4"/><path d="M12 17.2v.3"/>
  </g>

  <g th:case="'chart'">
    <path d="M4 20V4"/><path d="M4 20h16"/>
    <path d="M8 16v-4"/><path d="M12.5 16V8.5"/><path d="M17 16v-6"/>
  </g>

  <g th:case="'chat'">
    <path d="M4 5.5h16v10.5H9.5L4 20z"/>
  </g>

  <g th:case="'link'">
    <path d="M10.2 13.8a3.8 3.8 0 0 0 5.4 0l2.6-2.6a3.8 3.8 0 0 0-5.4-5.4l-1 1"/>
    <path d="M13.8 10.2a3.8 3.8 0 0 0-5.4 0l-2.6 2.6a3.8 3.8 0 0 0 5.4 5.4l1-1"/>
  </g>

  <g th:case="'settings'">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3.5v2.6"/><path d="M12 17.9v2.6"/>
    <path d="M3.5 12h2.6"/><path d="M17.9 12h2.6"/>
    <path d="m6 6 1.9 1.9"/><path d="m16.1 16.1 1.9 1.9"/>
    <path d="m18 6-1.9 1.9"/><path d="m7.9 16.1-1.9 1.9"/>
  </g>

  <g th:case="'send'">
    <path d="M20 4 3.5 10.5l6.7 2.6 2.6 6.7z"/>
    <path d="M10.2 13.1 20 4"/>
  </g>

  <g th:case="'book'">
    <path d="M4 5.4c3-1.4 5.5-1.4 8 0v14c-2.5-1.4-5-1.4-8 0z"/>
    <path d="M12 5.4c2.5-1.4 5-1.4 8 0v14c-2.5-1.4-5-1.4-8 0z"/>
  </g>

  <g th:case="'lock'">
    <rect x="5" y="10.5" width="14" height="9.5" rx="1.5"/>
    <path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>
  </g>

  <g th:case="'camera'">
    <path d="M4 8h3.2L8.8 6h6.4l1.6 2H20v11H4z"/>
    <circle cx="12" cy="13" r="3.2"/>
  </g>

  <g th:case="'image'">
    <rect x="3.5" y="5" width="17" height="14" rx="1.5"/>
    <circle cx="8.6" cy="10" r="1.6"/>
    <path d="m4 17.2 5-5 4 4 2.5-2.5 4.5 4.5"/>
  </g>

  <g th:case="'inbox'">
    <path d="M4 5.5h16V18.5H4z"/>
    <path d="M4 13h4l1.5 2h5L16 13h4"/>
  </g>

  <g th:case="*">
    <circle cx="12" cy="12" r="8.4"/>
  </g>
</svg>

</body>
</html>
