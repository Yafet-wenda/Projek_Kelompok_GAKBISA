<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Satu baris navigasi kiri; penanda aktif dibaca gk-sidebar.js dari data-path. -->
<th:block th:fragment="railItem(path, icon, label)">
  <a th:href="@{${path}}" class="rail-link" th:data-path="${path}">
    <th:block th:replace="~{fragments/icons :: icon(${icon})}"></th:block>
    <span th:text="${label}">Menu</span>
  </a>
</th:block>

<th:block th:fragment="sidebar">
<aside class="rail" id="gkSidebar" aria-label="Navigasi aplikasi">

  <div class="rail-drawer-head">
    <a th:href="@{/}" class="brand" aria-label="GAKBISA — beranda">
      <span class="brand-mark">
        <th:block th:replace="~{fragments/icons :: icon('brand')}"></th:block>
      </span>
      <span class="brand-name">GAKBISA</span>
    </a>
    <button type="button" class="icon-btn rail__close" id="gkSidebarClose" aria-label="Tutup menu navigasi">
      <th:block th:replace="~{fragments/icons :: icon('x')}"></th:block>
    </button>
  </div>

  <a th:href="@{/profile}" class="rail-profile" sec:authorize="isAuthenticated()" title="Lihat profil saya">
    <span class="avatar avatar--sm" aria-hidden="true">
      <img th:if="${#authentication.principal.user.avatarPath != null}"
           th:src="${#authentication.principal.user.avatarPath}" alt="">
      <span th:if="${#authentication.principal.user.avatarPath == null}"
            th:text="${#strings.toUpperCase(#strings.substring(#authentication.principal.user.fullName, 0, 1))}">U</span>
    </span>
    <div style="min-width:0;">
      <div class="rail-profile__name" th:text="${#authentication.principal.user.fullName}">Nama Pengguna</div>
      <div class="rail-profile__mail" th:text="${#authentication.principal.user.email}">user@gakbisa.test</div>
    </div>
  </a>
  <div class="rail-role" sec:authorize="isAuthenticated()">
    <span class="tag"
          th:classappend="${#authentication.principal.user.role.name() == 'ADMIN'} ? 'tag--warn' : 'tag--neutral'"
          th:text="${@label.role(#authentication.principal.user.role)}">Mahasiswa</span>
  </div>

  <div class="rail-label">Ruang belajar</div>
  <nav class="stack" style="gap:2px;" aria-label="Menu belajar">
    <th:block th:replace="~{fragments/sidebar :: railItem('/dashboard', 'home', 'Ringkasan')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/catalog', 'grid', 'Katalog keahlian')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/matching', 'users', 'Cari partner')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/barter', 'swap', 'Permintaan barter')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/sessions', 'calendar', 'Sesi belajar')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/portfolio', 'folder', 'Portofolio')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/notifications', 'bell', 'Notifikasi')}"></th:block>
  </nav>

  <div class="rail-label">Akun</div>
  <nav class="stack" style="gap:2px;" aria-label="Menu akun">
    <th:block th:replace="~{fragments/sidebar :: railItem('/profile', 'user', 'Profil saya')}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: railItem('/profile/skills', 'award', 'Keahlian saya')}"></th:block>
  </nav>

  <div sec:authorize="hasRole('ADMIN')">
    <div class="rail-label">Administrasi</div>
    <nav class="stack" style="gap:2px;" aria-label="Menu administrasi">
      <th:block th:replace="~{fragments/sidebar :: railItem('/admin', 'chart', 'Ringkasan admin')}"></th:block>
      <th:block th:replace="~{fragments/sidebar :: railItem('/admin/users', 'users', 'Kelola pengguna')}"></th:block>
      <th:block th:replace="~{fragments/sidebar :: railItem('/admin/categories', 'layers', 'Kategori keahlian')}"></th:block>
      <th:block th:replace="~{fragments/sidebar :: railItem('/admin/reports', 'flag', 'Laporan')}"></th:block>
    </nav>
  </div>

  <div class="rail-foot">
    <strong>GAKBISA</strong> / 2026<br>
    Gantian ajari, kita bisa.
  </div>
</aside>

<div class="rail-backdrop" id="gkSidebarBackdrop" aria-hidden="true"></div>
</th:block>

</body>
</html>
