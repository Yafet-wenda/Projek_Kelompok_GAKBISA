<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit portofolio')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="app-body app-body--single">
        <main class="app-main">

            <header class="page-head">
                <span class="eyebrow">Kelola karya <span>&#9679;</span></span>
                <h1 class="display">Edit <em>karya.</em></h1>
                <p class="lede">Perbarui informasi dan visibilitas karya Anda.</p>
            </header>

            <div th:if="${error}" class="notice notice--danger" role="alert">
                <th:block th:replace="~{fragments/icons :: icon('alert')}"></th:block>
                <span th:text="${error}"></span>
            </div>

            <section class="panel">
                <div class="panel-body">
                    <form th:action="@{'/portfolio/' + ${portfolio.id} + '/edit'}" method="post">
                        <div class="field">
                            <label for="title">Judul karya <span style="color:var(--red);">*</span></label>
                            <input id="title" type="text" name="title" maxlength="150"
                                   th:value="${portfolio.title}" required>
                        </div>

                        <div class="field">
                            <label for="description">Deskripsi</label>
                            <textarea id="description" name="description" rows="4"
                                      th:text="${portfolio.description}"></textarea>
                        </div>

                        <div class="field">
                            <span class="field__label">Visibilitas</span>
                            <div class="radio-grid">
                                <label class="radio-card">
                                    <input type="radio" name="visibility" value="PUBLIC"
                                           id="visPublic" th:checked="${portfolio.visibility.name() == 'PUBLIC'}">
                                    <span>
                                        <strong>Publik</strong>
                                        <span>Dapat dilihat oleh semua pengguna platform.</span>
                                    </span>
                                </label>
                                <label class="radio-card">
                                    <input type="radio" name="visibility" value="PRIVATE"
                                           id="visPrivate" th:checked="${portfolio.visibility.name() == 'PRIVATE'}">
                                    <span>
                                        <strong>Privat</strong>
                                        <span>Hanya Anda yang bisa melihat karya ini.</span>
                                    </span>
                                </label>
                            </div>
                        </div>

                        <div class="notice notice--info">
                            <th:block th:replace="~{fragments/icons :: icon('info')}"></th:block>
                            <div>
                                Berkas saat ini: <strong th:text="${portfolio.fileName}">berkas.jpg</strong>
                                (<span th:text="${portfolio.mimeType}">image/jpeg</span>).
                                <span class="muted small" style="display:block;margin-top:4px;">
                                    Mengubah formulir ini tidak menghapus atau mengganti berkas yang telah diunggah.
                                </span>
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top:22px;">
                            <button type="submit" class="btn btn--dark">
                                <th:block th:replace="~{fragments/icons :: icon('check')}"></th:block>
                                Simpan perubahan
                            </button>
                            <a th:href="@{/portfolio}" class="btn btn--ghost">Batal</a>
                        </div>
                    </form>
                </div>
                <div class="panel-foot">
                    <a th:href="@{/portfolio}" class="btn btn--ghost btn--sm">
                        <th:block th:replace="~{fragments/icons :: icon('arrow-left')}"></th:block>
                        Kembali ke portofolio
                    </a>
                </div>
            </section>

        </main>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
