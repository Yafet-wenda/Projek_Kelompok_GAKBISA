<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Bilah atas: merek, pencarian, tautan utama, notifikasi, menu akun.
  Penanda aktif ditangani gk-navbar.js lewat atribut data-path.
-->
<th:block th:fragment="navbar">
<header class="site-nav">
  <div class="site-nav__inner">

    <div class="site-nav__left">
      <button class="icon-btn rail-toggle" id="gk-sidebar-toggle" type="button"
              aria-label="Buka menu navigasi" aria-controls="gkSidebar" aria-expanded="false"
              sec:authorize="isAuthenticated()">
        <th:block th:replace="~{fragments/icons :: icon('menu')}"></th:block>
      </button>

      <a th:href="@{/}" class="brand" aria-label="GAKBISA — beranda">
        <span class="brand-mark">
          <th:block th:replace="~{fragments/icons :: icon('brand')}"></th:block>
        </span>
        <span class="brand-name">GAKBISA</span>
      </a>

      <nav class="nav-links" sec:authorize="isAuthenticated()" aria-label="Navigasi utama">
        <a th:href="@{/catalog}" data-path="/catalog">Katalog</a>
        <a th:href="@{/matching}" data-path="/matching">Cari partner</a>
        <a th:href="@{/barter}" data-path="/barter">Barter</a>
        <a th:href="@{/sessions}" data-path="/sessions">Sesi</a>
      </nav>
    </div>

    <div class="site-nav__right">

      <th:block sec:authorize="isAuthenticated()">
        <div class="nav-search">
          <th:block th:replace="~{fragments/icons :: icon('search')}"></th:block>
          <form th:action="@{/matching}" method="get" role="search">
            <input id="gk-nav-search" type="search" name="keyword"
                   placeholder="Cari keahlian atau partner" autocomplete="off"
                   aria-label="Cari partner keahlian">
          </form>
        </div>

        <button class="icon-btn nav-search-btn" id="gk-mobile-search-toggle" type="button"
                aria-label="Cari partner keahlian" aria-expanded="false">
          <th:block th:replace="~{fragments/icons :: icon('search')}"></th:block>
        </button>

        <div class="menu">
          <button class="icon-btn" type="button" data-menu-toggle
                  aria-label="Notifikasi" aria-haspopup="true" aria-expanded="false">
            <th:block th:replace="~{fragments/icons :: icon('bell')}"></th:block>
            <span class="nav-badge" id="gk-notif-badge" aria-live="polite" hidden>0</span>
          </button>
          <div class="menu-panel menu-panel--wide">
            <div class="menu-panel__head">
              <span>Notifikasi</span>
              <a th:href="@{/notifications}">Lihat semua</a>
            </div>
            <a th:href="@{/notifications}" class="menu-item">
              <th:block th:replace="~{fragments/icons :: icon('inbox')}"></th:block>
              <span>Kotak masuk pemberitahuan</span>
            </a>
          </div>
        </div>

        <div class="menu">
          <button class="nav-avatar" type="button" data-menu-toggle
                  aria-label="Menu akun" aria-haspopup="true" aria-expanded="false">
            <img th:if="${#authentication.principal.user.avatarPath != null}"
                 th:src="${#authentication.principal.user.avatarPath}" alt="">
            <span th:if="${#authentication.principal.user.avatarPath == null}"
                  th:text="${#strings.toUpperCase(#strings.substring(#authentication.principal.user.fullName, 0, 1))}">G</span>
          </button>
          <div class="menu-panel">
            <div class="menu-user">
              <span class="avatar avatar--sm" aria-hidden="true">
                <img th:if="${#authentication.principal.user.avatarPath != null}"
                     th:src="${#authentication.principal.user.avatarPath}" alt="">
                <span th:if="${#authentication.principal.user.avatarPath == null}"
                      th:text="${#strings.toUpperCase(#strings.substring(#authentication.principal.user.fullName, 0, 1))}">G</span>
              </span>
              <div style="min-width:0;">
                <div class="menu-user__name" sec:authentication="name">Pengguna</div>
                <div class="menu-user__meta">Akun GAKBISA</div>
              </div>
            </div>
            <a th:href="@{/profile}" class="menu-item">
              <th:block th:replace="~{fragments/icons :: icon('user')}"></th:block>
              <span>Profil saya</span>
            </a>
            <a th:href="@{/profile/skills}" class="menu-item">
              <th:block th:replace="~{fragments/icons :: icon('award')}"></th:block>
              <span>Keahlian saya</span>
            </a>
            <a th:href="@{/portfolio}" class="menu-item">
              <th:block th:replace="~{fragments/icons :: icon('folder')}"></th:block>
              <span>Portofolio</span>
            </a>
            <a th:href="@{/admin}" class="menu-item" sec:authorize="hasRole('ADMIN')">
              <th:block th:replace="~{fragments/icons :: icon('settings')}"></th:block>
              <span>Panel admin</span>
            </a>
            <form th:action="@{/logout}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="menu-item menu-item--danger">
                <th:block th:replace="~{fragments/icons :: icon('logout')}"></th:block>
                <span>Keluar</span>
              </button>
            </form>
          </div>
        </div>
      </th:block>

      <th:block sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="btn btn--line btn--sm">Masuk</a>
        <a th:href="@{/register}" class="btn btn--dark btn--sm">Daftar gratis</a>
      </th:block>

    </div>
  </div>
</header>

<div class="mobile-search" id="gk-mobile-search" hidden sec:authorize="isAuthenticated()">
  <form th:action="@{/matching}" method="get" role="search">
    <th:block th:replace="~{fragments/icons :: icon('search')}"></th:block>
    <input class="gk-mobile-search__input" type="search" name="keyword"
           placeholder="Cari keahlian atau partner" autocomplete="off"
           aria-label="Cari partner keahlian">
    <button class="icon-btn" id="gk-mobile-search-close" type="button" aria-label="Tutup pencarian">
      <th:block th:replace="~{fragments/icons :: icon('x')}"></th:block>
    </button>
  </form>
</div>

<nav class="bottom-nav" sec:authorize="isAuthenticated()" aria-label="Navigasi bawah">
  <a th:href="@{/dashboard}" data-path="/dashboard">
    <th:block th:replace="~{fragments/icons :: icon('home')}"></th:block>
    <span>Beranda</span>
  </a>
  <a th:href="@{/matching}" data-path="/matching">
    <th:block th:replace="~{fragments/icons :: icon('users')}"></th:block>
    <span>Partner</span>
  </a>
  <a th:href="@{/barter}" data-path="/barter">
    <th:block th:replace="~{fragments/icons :: icon('swap')}"></th:block>
    <span>Barter</span>
  </a>
  <a th:href="@{/sessions}" data-path="/sessions">
    <th:block th:replace="~{fragments/icons :: icon('calendar')}"></th:block>
    <span>Sesi</span>
  </a>
  <a th:href="@{/portfolio}" data-path="/portfolio">
    <th:block th:replace="~{fragments/icons :: icon('folder')}"></th:block>
    <span>Karya</span>
  </a>
</nav>
</th:block>

</body>
</html>
