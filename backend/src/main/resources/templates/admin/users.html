<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin - Pengguna')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="fb-layout container-fluid">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="fb-main" style="max-width:1000px;">

        <div th:if="${success}" class="fb-alert fb-alert-success mt-2">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        </div>

        <div class="fb-card">
            <div class="fb-card-header" style="padding:16px;">
                <h4 style="font-size:22px;font-weight:700;margin:0;">
                    <i class="bi bi-people-fill text-primary me-2"></i>Kelola Pengguna
                </h4>
                <span class="fb-badge fb-badge-scheduled" th:text="${users.size()} + ' pengguna'">0</span>
            </div>

            <div th:if="${#lists.isEmpty(users)}" class="fb-empty">
                <i class="bi bi-people"></i>
                <h5>Belum Ada Pengguna</h5>
            </div>

            <div th:if="${!#lists.isEmpty(users)}" class="p-0">
                <table class="fb-table">
                    <thead>
                        <tr>
                            <th>Pengguna</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Bergabung</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="fb-avatar-placeholder" style="width:36px;height:36px;font-size:14px;flex-shrink:0;">
                                        <span th:text="${#strings.substring(user.fullName,0,1)}">A</span>
                                    </div>
                                    <span style="font-weight:600;font-size:14px;" th:text="${user.fullName}">Nama</span>
                                </div>
                            </td>
                            <td style="font-size:13px;color:#65676B;" th:text="${user.email}">email</td>
                            <td>
                                <span class="fb-badge"
                                      th:classappend="${user.role == 'ADMIN'} ? 'fb-badge-scheduled' : 'fb-badge-cancelled'"
                                      th:text="${user.role}">STUDENT</span>
                            </td>
                            <td>
                                <span class="fb-badge"
                                      th:classappend="${user.status == 'ACTIVE'} ? 'fb-badge-accepted' : 'fb-badge-rejected'"
                                      th:text="${user.status}">ACTIVE</span>
                            </td>
                            <td style="font-size:13px;color:#65676B;"
                                th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Tanggal</td>
                            <td>
                                <div class="d-flex gap-1">
                                    <form th:if="${user.status == 'ACTIVE'}"
                                          th:action="@{'/admin/users/' + ${user.id} + '/suspend'}"
                                          method="post" style="margin:0;">
                                        <button type="submit" class="btn btn-fb-danger btn-sm"
                                                data-confirm="Suspend pengguna ini?"
                                                title="Suspend">
                                            <i class="bi bi-pause-circle"></i>
                                        </button>
                                    </form>
                                    <form th:if="${user.status != 'ACTIVE'}"
                                          th:action="@{'/admin/users/' + ${user.id} + '/activate'}"
                                          method="post" style="margin:0;">
                                        <button type="submit" class="btn btn-success btn-sm"
                                                title="Aktifkan">
                                            <i class="bi bi-play-circle"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{'/profile/' + ${user.id}}"
                                       class="btn btn-fb-secondary btn-sm" title="Lihat Profil">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
    <aside class="fb-sidebar-right"></aside>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
