<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="id">
<head th:replace="~{fragments/head :: head('Katalog')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="app-shell" th:classappend="${!#authorization.expression('isAuthenticated()')} ? 'app-shell--bare'">
    <th:block sec:authorize="isAuthenticated()">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    </th:block>

    <div class="app-body app-body--single">
        <main class="app-main" id="isi">

            <header class="page-head">
                <div>
                    <span class="eyebrow">Katalog publik</span>
                    <h1 class="display">Keahlian dan karya</h1>
                    <p class="lede">
                        Daftar keahlian yang tercatat di katalog umum, ditambah karya yang
                        diunggah anggota. Semua bisa dibaca tanpa akun; masuk untuk
                        mengajukan barter kepada pemiliknya.
                    </p>
                </div>
            </header>

            <div class="searchbar">
                <form id="form-cari" role="search" style="display:flex;gap:10px;flex:1;min-width:0;">
                    <input type="search" id="cari"
                           placeholder="Cari keahlian, mis. Excel, UI/UX, bahasa Inggris"
                           aria-label="Kata kunci keahlian">
                    <button class="btn btn--dark btn--sm" type="submit">Cari</button>
                </form>
            </div>

            <div class="chip-row" id="kategori-chips">
                <button class="chip active" type="button" data-id="">Semua kategori</button>
            </div>

            <div class="section-head">
                <h2>Keahlian</h2>
                <span class="muted small" id="hitung-keahlian">memuat</span>
            </div>

            <div class="panel">
                <div class="list" id="grid-keahlian">
                    <div class="list-item"><div class="skeleton" style="height:40px;"></div></div>
                    <div class="list-item"><div class="skeleton" style="height:40px;"></div></div>
                    <div class="list-item"><div class="skeleton" style="height:40px;"></div></div>
                </div>
            </div>
            <div style="text-align:center;margin-top:16px;">
                <button class="btn btn--line btn--sm" id="muat-lagi" type="button" hidden>
                    Muat lebih banyak
                </button>
            </div>

            <div class="section-head" style="margin-top:48px;">
                <h2>Karya anggota</h2>
                <span class="muted small" id="hitung-karya">memuat</span>
            </div>

            <div class="work-grid" id="grid-karya">
                <div class="skeleton" style="height:190px;"></div>
                <div class="skeleton" style="height:190px;"></div>
            </div>
            <p class="muted small" id="kosong-karya" hidden>Belum ada karya yang diunggah.</p>

        </main>
    </div>
</div>

<dialog class="dialog" id="detail-karya" aria-labelledby="dlg-judul">
    <div class="dialog__head">
        <h2 id="dlg-judul">Detail karya</h2>
        <button class="icon-btn" type="button" data-tutup aria-label="Tutup detail">
            <th:block th:replace="~{fragments/icons :: icon('x')}"></th:block>
        </button>
    </div>
    <div id="dlg-isi"></div>
    <div class="dialog__foot">
        <button class="btn btn--line btn--sm" type="button" data-tutup>Tutup</button>
    </div>
</dialog>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/catalog.js}"></script>
</body>
</html>
